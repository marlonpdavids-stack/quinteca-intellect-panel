# Example panel block for configuration.yaml. Replace the entity IDs with the
# client's own (Settings > Tools > Template can list them).
panel_custom:
  - name: quinteca-panel
    url_path: quinteca
    sidebar_title: Quinteca
    sidebar_icon: mdi:home-variant
    module_url: /local/quinteca/quinteca-panel.js?v=1
    config:
      panelId: 123exam-panel1
      homeName: Casa Example
      location: Cascais
      greetingName: Client
      screensaverMinutes: 3
      weather: weather.forecast_home
      alarm: alarm_control_panel.alarm_manager
      gate: button.entry_door_unlock
      gateName: Entry door
      frontDoor: lock.front_door
      frontDoorName: Front door
      doorbell: event.entry_doorbell
      cameras:
        - entity: camera.entry_high_resolution_channel
          name: Entry
          gate: true
        - entity: camera.garden_high_resolution_channel
          name: Garden
      zones:
        - entity: binary_sensor.entry_door
          name: Entry door
        - entity: binary_sensor.garden_motion
          name: Garden motion
      rooms:
        - name: Living room
          lights: [light.living_spots, light.living_lamp]
          covers: [cover.living_window]
